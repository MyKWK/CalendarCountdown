name: CalendarCountdown
options:
  bundleIdPrefix: app.calendarcountdown
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  CalendarCountdownCore:
    type: library.static
    platform: macOS
    sources:
      - path: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.calendarcountdown.CalendarCountdown.Core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  CalendarCountdownCalendar:
    type: library.static
    platform: macOS
    sources:
      - path: CalendarBridge
    dependencies:
      - target: CalendarCountdownCore
      - sdk: EventKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.calendarcountdown.CalendarCountdown.Calendar
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  CalendarCountdownPersistence:
    type: library.static
    platform: macOS
    sources:
      - path: Persistence
    dependencies:
      - target: CalendarCountdownCore
      - sdk: CloudKit.framework
      - sdk: sqlite3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.calendarcountdown.CalendarCountdown.Persistence
        PRODUCT_MODULE_NAME: CalendarCountdownPersistence
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: ["$(inherited)", "-lsqlite3"]

  CalendarCountdown:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: SharedUI
      - path: Services
      - path: Resources
      - path: Localization
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: 日历倒数
        CFBundleShortVersionString: 1.0.2
        CFBundleVersion: "3"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSCalendarsFullAccessUsageDescription: “日历倒数”需要读取你的日历以计算倒数，并只在你确认后向选定日历写入事件。
        CFBundleURLTypes:
          - CFBundleURLName: CalendarCountdown Event
            CFBundleURLSchemes:
              - calendarcountdown
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.personal-information.calendars: true
    dependencies:
      - target: CalendarCountdownCore
      - target: CalendarCountdownCalendar
      - target: CalendarCountdownPersistence
      - target: CalendarCountdownWidget
        embed: true
      - sdk: EventKit.framework
      - sdk: WidgetKit.framework
      - sdk: CloudKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.calendarcountdown.CalendarCountdown
        PRODUCT_NAME: CalendarCountdown
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic

  CalendarCountdownWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Localization
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: 日历倒数
        CFBundleShortVersionString: 1.0.2
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
    dependencies:
      - target: CalendarCountdownCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.calendarcountdown.CalendarCountdown.Widget
        PRODUCT_NAME: CalendarCountdownWidget
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic

  calcount:
    type: tool
    platform: macOS
    sources:
      - path: CLI
    info:
      path: Config/CLI-Info.plist
      properties:
        CFBundleShortVersionString: 1.0.2
        CFBundleVersion: "3"
        NSCalendarsFullAccessUsageDescription: calcount 需要读取 Apple 日历并管理你明确指定的日历事件。
    entitlements:
      path: Config/CLI.entitlements
      properties:
        com.apple.security.personal-information.calendars: true
    dependencies:
      - target: CalendarCountdownCore
      - target: CalendarCountdownCalendar
      - sdk: EventKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.calendarcountdown.CalendarCountdown.CLI
        PRODUCT_NAME: calcount
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic

  CalendarCountdownCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: CalendarCountdownCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.calendarcountdown.CalendarCountdown.CoreTests
        GENERATE_INFOPLIST_FILE: YES

  CalendarCountdownPersistenceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PersistenceTests
    dependencies:
      - target: CalendarCountdownPersistence
      - target: CalendarCountdownCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.calendarcountdown.CalendarCountdown.PersistenceTests
        GENERATE_INFOPLIST_FILE: YES

  CalendarCountdowniOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Core
      - path: CalendarBridge
      - path: Persistence
      - path: Services
      - path: SharedUI
      - path: Mobile
      - path: App
        excludes:
          - CalendarCountdownApp.swift
          - MenuBarContentView.swift
          - AppearanceSettings.swift
          - RootView.swift
      - path: Resources
      - path: Localization
    info:
      path: Config/iOS-App-Info.plist
      properties:
        CFBundleDisplayName: 日历倒数
        CFBundleShortVersionString: 1.0.2
        CFBundleVersion: "3"
        LSRequiresIPhoneOS: true
        NSCalendarsFullAccessUsageDescription: “日历倒数”需要读取你的日历以计算倒数，并只在你确认后向选定日历写入事件。
        NSRemindersFullAccessUsageDescription: “日历倒数”可选择把任务和打卡投影到提醒事项，需要你的授权。
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: CalendarCountdown Event
            CFBundleURLSchemes:
              - calendarcountdown
    entitlements:
      path: Config/iOS-App.entitlements
    dependencies:
      - target: CalendarCountdowniOSWidget
        embed: true
      - sdk: EventKit.framework
      - sdk: WidgetKit.framework
      - sdk: CloudKit.framework
      - sdk: sqlite3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.calendarcountdown.CalendarCountdown.ios
        PRODUCT_MODULE_NAME: CalendarCountdown
        PRODUCT_NAME: CalendarCountdown
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Config/iOS-App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iOS-App.entitlements
        OTHER_LDFLAGS: ["$(inherited)", "-lsqlite3"]

  CalendarCountdowniOSWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WidgetiOS
      - path: Core
      - path: Localization
    info:
      path: Config/iOS-Widget-Info.plist
      properties:
        CFBundleDisplayName: 日历倒数
        CFBundleShortVersionString: 1.0.2
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/iOS-Widget.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.calendarcountdown.CalendarCountdown.ios.Widget
        PRODUCT_NAME: CalendarCountdowniOSWidget
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Config/iOS-Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iOS-Widget.entitlements

  CalendarCountdowniOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MobileTests
    dependencies:
      - target: CalendarCountdowniOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.calendarcountdown.CalendarCountdown.ios.Tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CalendarCountdown.app/CalendarCountdown"
        BUNDLE_LOADER: "$(TEST_HOST)"

  CalendarCountdowniOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MobileUITests
    dependencies:
      - target: CalendarCountdowniOS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.calendarcountdown.CalendarCountdown.ios.UITests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: CalendarCountdowniOS

schemes:
  CalendarCountdown:
    build:
      targets:
        CalendarCountdown: all
        CalendarCountdownWidget: all
        calcount: all
        CalendarCountdownCoreTests: [test]
        CalendarCountdownPersistenceTests: [test]
    test:
      targets:
        - CalendarCountdownCoreTests
        - CalendarCountdownPersistenceTests
    run:
      config: Debug
    archive:
      config: Release
  CalendarCountdowniOS:
    build:
      targets:
        CalendarCountdowniOS: all
        CalendarCountdowniOSWidget: all
        CalendarCountdowniOSTests: [test]
        CalendarCountdowniOSUITests: [test]
    test:
      targets:
        - CalendarCountdowniOSTests
        - CalendarCountdowniOSUITests
    run:
      config: Debug
    archive:
      config: Release
  calcount:
    build:
      targets:
        calcount: all
    run:
      config: Debug
